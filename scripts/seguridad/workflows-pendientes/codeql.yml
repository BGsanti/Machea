name: CodeQL

# Análisis estático de GitHub: busca inyecciones, XSS, uso inseguro de datos y otras fallas en el código propio.
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "41 9 * * 1" }]

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v3
