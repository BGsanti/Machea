name: Seguridad

# Cada cambio y cada madrugada: busca secretos en el código y en TODO el historial, audita las dependencias de los
# tres proyectos y comprueba que la política de seguridad de la landing siga coincidiendo con su página.
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 10 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Buscar llaves y contraseñas (archivos e historial)
        run: python3 scripts/seguridad/escanear-secretos.py --historial

  landing:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --ignore-scripts
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - name: Herramientas de desarrollo sin vulnerabilidades altas
        run: npm audit --audit-level=high
      - run: npm run build
      - name: La política de seguridad (CSP) coincide con la página
        run: node scripts/verificar-csp.mjs
      - run: npm run test:auth

  crm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: crm } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: crm/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - name: Todas las migraciones de Supabase aplican en orden (Postgres real)
        run: pnpm prueba:sql

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pip-audit
      - name: Dependencias sin vulnerabilidades conocidas
        run: pip-audit -r requirements.txt
      - run: python -m unittest discover -s tests -t .
