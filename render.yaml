services:
  - type: web
    name: machea-api
    runtime: python
    plan: free
    branch: version_0.2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DAPTA_FLOW_WEBHOOK_URL
        sync: false
