services:
  - type: web
    name: machea-api
    runtime: python
    plan: free
    branch: main
    # El backend vive en backend/. `rootDir` hace que el build y el arranque
    # ocurran ahí dentro, que es donde `Model` es importable.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DAPTA_FLOW_WEBHOOK_URL
        sync: false
      - key: DAPTA_API_KEY
        sync: false
      # --- Demo con marca ("Pruébalo con tu marca"), seguimiento y topes. Todas opcionales. ---
      - key: FRONT_URL                  # origen del front, para el enlace de la demo
        sync: false
      - key: DEMO_SECRET                # firma de los enlaces de demo (si falta, se deriva de DAPTA_API_KEY)
        sync: false
      - key: SMTP_USER                  # cuenta de Gmail que envía (machea.co@gmail.com)
        sync: false
      - key: SMTP_PASSWORD              # su "contraseña de aplicación" de Google (16 letras)
        sync: false
      - key: DAPTA_EMAIL_FLOW_URL       # alternativa: flow de Dapta con Gmail; sin SMTP ni esto no se envía
        sync: false
      - key: CORREO_EQUIPO              # a dónde avisa cada demo solicitada (por defecto equipo@machea.co)
        sync: false
      - key: DAPTA_WHATSAPP_FLOW_URL    # flow de Dapta que envía la plantilla de WhatsApp; sin él, apagado
        sync: false
      - key: LIMITE_TELEFONOS_EXENTOS   # números del equipo que no se topan (coma); para probar
        sync: false
      - key: DEMO_SOLICITUDES_POR_IP_HORA   # demos con marca por conexión y hora (por defecto 12)
        sync: false
      # --- Panel de administración (/admin/ en el front). Apagado hasta definir ADMIN_PASSWORD. ---
      - key: ADMIN_PASSWORD             # 16+ caracteres; es la llave de entrada al panel
        sync: false
      - key: ADMIN_TOTP_SECRET          # opcional pero recomendado: segundo factor (base32)
        sync: false
      - key: SUPABASE_ANON_KEY          # la clave anónima (pública) para que el panel pruebe la base
        sync: false
      - key: ADMIN_SESION_MINUTOS       # duración de la sesión (por defecto 60)
        sync: false
      # --- Login de empresas (api/acceso.py; guía: design/login/PUESTA_EN_MARCHA.md) ---
      - key: DATABASE_URL               # SECRETA. Postgres de las cuentas: cadena del "Session pooler" de Supabase (IPv4)
        sync: false
      - key: ORIGENES_ACCESO            # opcional: más orígenes del front (coma). machea.co y www.machea.co ya están
